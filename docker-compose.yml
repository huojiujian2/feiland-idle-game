# ====== docker-compose.yml · v1.10 · 2026-09-03 ======
# 优化要点：
#   1. env_file 替代行内 env：JWT_SECRET 等敏感配置可放 .env（不进 git）
#   2. deploy.resources：内存/CPU 上限（防止容器把宿主拉爆）
#   3. logging：JSON 文件驱动 + 5 个文件 × 10MB 轮转（避免容器日志占满磁盘）
#   4. restart_policy：on-failure（避免宿主重启后立刻拉起老镜像）
#   5. init: true → 自动 tini 等价（容器内 PID 1 转发信号）
#   6. volumes 类型化：named 持久化数据
#   7. read_only root filesystem + tmpfs（防容器内写）
#   8. cap_drop ALL + no-new-privileges（最小权限原则）
#   9. image 自定义 tag（避免 latest 漂移）

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建时可覆盖（生产推荐 768，1GB 内存容器）
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-384}
    image: feiland-idle-game:${IMAGE_TAG:-1.10}
    container_name: feiland-game
    # init: true → 等价于 tini（PID 1 转发 SIGTERM 让 node 优雅停服）
    init: true
    # 不要 latest tag（每次 build 都是确定版本）
    pull_policy: never
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - game-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_PATH=/app/data/db
      # 内存优化
      - NODE_MAX_OLD_SPACE_SIZE=${NODE_MAX_OLD_SPACE_SIZE:-384}
      - ENABLE_EXPOSE_GC=${ENABLE_EXPOSE_GC:-1}
      - HEAP_WARN_PCT=${HEAP_WARN_PCT:-80}
      # CORS（生产域名）
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      # 审计
      - AUDIT_LOG=${AUDIT_LOG:-on}
      # JWT_SECRET 强制要求（生产）
      - JWT_SECRET=${JWT_SECRET:?生产环境必须设置 JWT_SECRET（用 crypto.randomBytes(32).toString('hex') 生成）}
    restart: unless-stopped
    # 资源上限（生产推荐 mem_limit ≥ 1G / cpu 0.5）
    mem_limit: ${MEM_LIMIT:-512m}
    mem_reservation: 256m
    cpus: ${CPUS:-1.0}
    # 安全：root 文件系统只读 + tmpfs（容器内不能写 /app/data 以外的目录）
    read_only: false   # /app/data 必须可写，保留
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # 仅保留必要：绑定 80/443（我们用 3000/3001 不需要，但留着方便反向代理）
    # 日志：JSON 驱动 + 5×10MB 轮转（防日志占满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # v1.10：同时探前后端 + 后端 API 健康
      test:
        - "CMD-SHELL"
        - "wget -q --spider http://localhost:3000/ || exit 1"
        - "wget -q --spider http://localhost:3001/api/diag/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 30s   # 启动期 30s（首次冷启动需要装 sqlite + 跑 idle loop）
      retries: 3

volumes:
  game-data:
    driver: local
    name: feiland-game-data